<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mihu ❤️ Succhi</title>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: center;
    background: linear-gradient(to bottom right, #ff758c, #ff7eb3);
    color: white;
    overflow-x: hidden;
}

h1 {
    font-size: 26px;
    margin-top: 30px;
}

img {
    width: 90%;
    max-width: 320px;
    border-radius: 20px;
    margin-top: 20px;
    box-shadow: 0 0 20px rgba(255,255,255,0.7);
}

.btn-container {
    margin-top: 30px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
}

#yesBtn {
    background-color: #ff1744;
    color: white;
}

#noBtn {
    background-color: gray;
    color: white;
}

#letter {
    max-width: 90%;
    margin: 40px auto;
    font-size: 20px;
    line-height: 1.7;
    white-space: pre-wrap;
}

/* Floating hearts */
.heart {
    position: fixed;
    color: rgba(255,255,255,0.7);
    animation: float 6s linear infinite;
    font-size: 20px;
    z-index: -1;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<div id="mainContent">

<h1>Succhi ❤️<br>Will you be Mihu's Valentine?</h1>

<img src="photo.jpeg" alt="Mihu and Succhi">

<div class="btn-container">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 🥺</button>
</div>

</div>

<div id="letter"></div>

<br>
<button onclick="startMusic()" style="background:#fff;color:#ff1744;">
🎵 Tap to Enable Romantic Music
</button>

<audio id="bgMusic" loop>
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const music = document.getElementById("bgMusic");

function startMusic() {
    music.play();
}

// Move NO button slightly (fun effect)
noBtn.addEventListener("click", function() {
    noBtn.style.position = "relative";
    noBtn.style.left = Math.random() * 50 + "px";
});

yesBtn.addEventListener("click", function() {

    music.play();

    document.getElementById("mainContent").style.display = "none";

    const heading = document.createElement("h1");
    heading.innerHTML = "Happy First Valentine After Marriage ❤️💍";
    document.body.insertBefore(heading, document.getElementById("letter"));

    startHearts();
    typeLetter();
});

function typeLetter() {

const text = `This is our first Valentine as husband and wife… and I just want you to know how special you are to me.

Marrying you was the best decision of my life.
Every day with you feels like a blessing I never want to take for granted.

You are not just my Valentine…
You are my home, my peace, my happiness, and my forever.

I promise to love you, support you, annoy you, protect you, and stand beside you —
in every season of life.

Thank you for choosing me, Mihu.
I am the luckiest husband in this world.

Happy Valentine’s Day, my beautiful Succhi ❤️

Forever yours,
Mihu 💖`;

    let i = 0;
    const speed = 35;
    const letterDiv = document.getElementById("letter");

    function typing() {
        if (i < text.length) {
            letterDiv.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }

    typing();
}

// Floating hearts animation
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 15) + "px";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }, 500);
}

</script>

</body>
</html>
